<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO & Social Meta Tags -->
    <title>AlliMéntate Premium | Recetario IA</title>
    <meta name="description" content="Descubre tu próxima comida con nuestro Chef de Inteligencia Artificial. Busca recetas según lo que tienes en tu refrigerador.">
    <meta name="theme-color" content="#b45309">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://allimentate.vercel.app/">
    <meta property="og:title" content="AlliMéntate Premium | Tu Chef de IA">
    <meta property="og:description" content="Dile al Chef IA qué ingredientes tienes y te recomendará las mejores recetas al instante.">
    <meta property="og:image" content="https://allimentate.vercel.app/assets/logo.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://allimentate.vercel.app/">
    <meta property="twitter:title" content="AlliMéntate Premium | Tu Chef de IA">
    <meta property="twitter:description" content="Dile al Chef IA qué ingredientes tienes y te recomendará las mejores recetas al instante.">
    <meta property="twitter:image" content="https://allimentate.vercel.app/assets/logo.jpg">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="apple-touch-icon" href="assets/logo.jpg">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="assets/logo.jpg" alt="Chef Alli" class="logo-img">
            <h1 class="app-title">AlliMéntate</h1>
        </div>
    </header>

    <!-- Search -->
    <div class="search-container" id="normal-search-container">
        <div class="search-box">
            <span class="material-icons-round">search</span>
            <input type="text" id="search-input" placeholder="¿Qué se te antoja hoy?..." autocomplete="off">
        </div>
    </div>

    <!-- Fridge Search Container -->
    <div class="search-container" id="fridge-search-container" style="display: none;">
        <div style="background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(93, 46, 30, 0.08); border: 1px solid rgba(146, 64, 14, 0.08); text-align: center;">
            <h3 style="color: var(--primary); margin-bottom: 10px; font-family: var(--font-logo); font-size: 1.8rem;">¿Qué ingredientes tienes?</h3>
            <textarea id="fridge-input" placeholder="Ej: chuleta de cerdo, cebolla, arroz..." style="width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; font-family: var(--font-main); resize: none; margin-bottom: 10px;" rows="2"></textarea>
            <button id="btn-fridge-search" onclick="App.searchByIngredients(document.getElementById('fridge-input').value)" style="background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-family: var(--font-main); font-size: 1rem; cursor: pointer; width: 100%;">Buscar con el Chef AI ✨</button>
            
            <!-- AI Message Container -->
            <div id="ai-message-container" style="display: none; margin-top: 15px; padding: 15px; background: #fffbeb; border-radius: 10px; border-left: 4px solid var(--accent); text-align: left; font-size: 0.95rem; color: #78350f;">
                <strong>👨‍🍳 El Chef opina:</strong> <span id="ai-message-text"></span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="content">
        <!-- Category Filters -->
        <div class="category-filters" id="category-filters">
            <!-- Injected by JS -->
        </div>

        <!-- Recipe Count & Title -->
        <h2>
            <span id="recipe-count">Cargando...</span>
        </h2>

        <!-- Recipe Grid -->
        <div class="recipe-grid" id="recipe-list">
            <!-- Cards Injected by JS -->
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="App.filter('all')">
            <span class="material-icons-round">restaurant_menu</span>
            <small>Recetas</small>
        </button>

        <button class="nav-item" onclick="App.random()">
            <span class="material-icons-round" style="color:var(--accent);">casino</span>
            <small>Aleatorio</small>
        </button>

        <button class="nav-item" onclick="App.filter('refri')">
            <span class="material-icons-round" style="color:#0ea5e9;">kitchen</span>
            <small>Mi Refri</small>
        </button>

        <button class="nav-item" onclick="App.filter('favorites')">
            <span class="material-icons-round">favorite</span>
            <small>Favoritos</small>
        </button>
    </nav>

    <!-- Recipe Detail Modal -->
    <div id="recipe-modal" class="recipe-modal">
        <div class="modal-header">
            <img id="modal-img" src="" alt="">
            <button class="modal-close" onclick="App.closeModal()">
                <span class="material-icons-round">close</span>
            </button>
        </div>
        <div class="modal-body">
            <span class="card-category" id="modal-cat"
                style="top:-20px; left:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">Categoría</span>

            <h2 id="modal-title" class="modal-title">Título Receta</h2>

            <div style="display:flex; gap:15px; margin-bottom:25px; color:#a16207; font-weight:600;">
                <span style="display:flex; align-items:center; gap:5px;">
                    <span class="material-icons-round">schedule</span>
                    <span id="modal-time">min</span>
                </span>
            </div>

            <h3 style="color:#78350f; margin-bottom:15px;">Ingredientes</h3>
            <ul class="ingredients-list" id="modal-ingredients">
                <!-- Li items -->
            </ul>

            <h3 style="color:#78350f; margin-bottom:15px;">Preparación</h3>
            <div class="steps-list" id="modal-steps">
                <!-- Pasos -->
            </div>

            <div style="height:50px;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW registrado'))
                .catch(err => console.error('SW fallo', err));
        }
    </script>
</body>

</html>
